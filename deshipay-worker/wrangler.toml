name = "deshipay-verify"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "bot-telegram-refar"
# আপনার প্রথমবার deploy করার পর Cloudflare যে workers.dev URL দেবে সেটা এখানে বসান,
# তারপর আবার `npm run deploy` চালান। উদাহরণ:
# WORKER_BASE_URL = "https://deshipay-verify.yourname.workers.dev"
WORKER_BASE_URL = "https://deshipay-verify.deshipay.workers.dev"

# গোপন কী (private key ইত্যাদি) কখনো এখানে লিখবেন না — এগুলো secret হিসেবে
# টার্মিনাল থেকে বসাতে হবে (README দেখুন):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
